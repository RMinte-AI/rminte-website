<body class="brand-page">
<header class="ad-bar"><a href="/cases/"><img src="../assets/images/logo-white.svg" alt="RMinte"></a><div class="r"><span class="who" id="account-who" hidden></span><button class="cs-pill ghost" id="change-password" type="button" hidden>修改密码</button><button class="cs-pill ghost" id="logout" type="button" hidden>退出登录</button><a class="cs-pill ghost" href="/cases/">返回案例</a></div></header>
<main class="ad-main">
<section id="login-panel" class="ad-login"><p class="ad-eyebrow">账号与合作管理</p><h1>管理员登录</h1><div class="ad-panel"><form id="admin-login"><label class="cs-field"><span>用户名</span><input name="username" autocomplete="username" required></label><label class="cs-field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required></label><button class="cs-pill primary" type="submit">登录</button><div id="login-message" role="status"></div></form></div></section>
<section id="admin-panel" hidden><p class="ad-eyebrow">管理后台</p><h1>账号与合作</h1>
<div class="ad-tabs" role="tablist" aria-label="管理功能"><button type="button" role="tab" id="tab-users" aria-selected="true" aria-controls="users-panel" data-tab="users">用户管理</button><button type="button" role="tab" id="tab-inbox" aria-selected="false" aria-controls="inbox-panel" data-tab="inbox" tabindex="-1">收件箱<span class="n" id="unread" hidden></span></button></div>
<section id="users-panel" role="tabpanel" aria-labelledby="tab-users"><div class="ad-panel ad-create"><div><h2>分发账号</h2><p>直接生成账号与 12 位密码，生成后在下方列表中管理权限。新账号默认没有任何权限。</p></div><form id="create-user"><button class="cs-pill primary" type="submit">生成账号</button></form></div>
<div class="ad-new" id="new-account" hidden aria-live="polite"></div>
<div class="ad-head"><div><h2>已分发账号</h2></div><button class="ad-btn" id="refresh-users" type="button">刷新</button></div><p class="ad-note">登录记录保留 90 天。地区来自 IP 定位，仅供参考；本地开发不模拟真实地区。</p>
<table class="ad-table"><thead><tr><th>账号 / 密码</th><th>访问权限</th><th>最近登录</th><th>IP / 地区</th><th>操作</th></tr></thead><tbody id="users"></tbody></table>
<div class="ad-pager"><button class="ad-btn" id="users-prev" type="button">上一页</button><span id="users-page"></span><button class="ad-btn" id="users-next" type="button">下一页</button></div></section>
<section id="inbox-panel" role="tabpanel" aria-labelledby="tab-inbox" hidden><div class="ad-head flush"><div><h2>软件合作伙伴申请</h2><p>查看申请信息，通过对方留下的邮箱联系。</p></div><button class="ad-btn" id="refresh-inbox" type="button">刷新</button></div>
<div class="ad-msgs" id="messages"></div>
<div class="ad-pager"><button class="ad-btn" id="inbox-prev" type="button">上一页</button><span id="inbox-page"></span><button class="ad-btn" id="inbox-next" type="button">下一页</button></div></section></section></main>
<dialog class="cs-dialog" id="password-dialog" data-bevel aria-labelledby="password-title"><div class="cs-dialog-core"><div class="cs-dialog-top"><span class="e">管理员</span><button class="contact-close" type="button" aria-label="关闭" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2 id="password-title">修改密码</h2><p class="lead" id="password-help">新密码至少 15 个字符，支持字母、数字和符号。保存后，所有设备上的管理员登录将失效，请用新密码重新登录。</p><form id="password-form"><label class="cs-field"><span>当前密码</span><input name="current_password" type="password" autocomplete="current-password" maxlength="128" required></label><label class="cs-field"><span>新密码</span><input name="new_password" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="password-help" required></label><label class="cs-field"><span>确认新密码</span><input name="confirm_password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></label><div id="password-message" role="status"></div><div class="actions"><button class="cs-pill primary" type="submit">保存新密码</button></div></form></div></dialog>
<dialog class="cs-dialog" id="history" data-bevel aria-labelledby="history-title"><div class="cs-dialog-core"><div class="cs-dialog-top"><span class="e" id="history-user"></span><button class="contact-close" type="button" aria-label="关闭" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><h2 id="history-title">登录记录</h2><div class="cs-events" id="events"></div><div class="ad-pager" id="history-pager" hidden><button class="ad-btn" id="history-prev" type="button">上一页</button><button class="ad-btn" id="history-next" type="button">下一页</button></div></div></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
